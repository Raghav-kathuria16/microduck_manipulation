# ============================================================
# Teleop Control Mapping Configuration
# ============================================================
# Maps physical inputs (keyboard/gamepad) to the hierarchical
# command layers defined in Teleop Spec §3.2.
#
# Layers:
#   1. Locomotion — 2D velocity command → existing walk policy
#   2. Head/neck aim — look-at point → IK/PD controller
#   3. Beak fine position — relative nudges → IK controller
#   4. Grasp — discrete open/close toggle → beak actuator
# ============================================================

# --- Locomotion layer ---
locomotion:
  description: >
    2D velocity/direction commands fed to the trained walking
    policy from microduck_rl. Human sets direction and speed;
    the walk policy produces stable gait.
  keyboard:
    forward: W
    backward: S
    turn_left: A
    turn_right: D
    speed_up: SHIFT   # hold for faster walk
  gamepad:
    left_stick_y: forward_backward
    left_stick_x: turn
  velocity_limits:
    max_forward_mps: 0.3    # meters/sec — duck-scale
    max_turn_radps: 1.5     # radians/sec

# --- Head/neck aim layer ---
head_aim:
  description: >
    2D cursor or stick input mapped to a look-at point in front
    of the robot. IK/PD controller drives neck+head joints.
  keyboard:
    look_up: UP
    look_down: DOWN
    look_left: LEFT
    look_right: RIGHT
  gamepad:
    right_stick_y: pitch
    right_stick_x: yaw
  mouse:
    enabled: true
    description: "Mouse position on beak-cam view maps to look-at direction"

# --- Beak fine positioning layer ---
beak_fine:
  description: >
    Small relative nudges to the beak tip position, active only
    during the grasp approach phase. Uses IK within a limited
    local workspace around the current head pose.
  keyboard:
    nudge_forward: I
    nudge_backward: K
    nudge_up: U
    nudge_down: J
  gamepad:
    dpad_up: nudge_forward
    dpad_down: nudge_backward
    dpad_left: nudge_up     # repurposed for vertical
    dpad_right: nudge_down
  nudge_step_m: 0.005   # 5mm per input tick

# --- Grasp layer ---
grasp:
  description: >
    Single discrete input toggles beak open/close. Matches the
    real hardware's simple close/open action.
  keyboard:
    toggle: SPACE
  gamepad:
    toggle: right_bumper
  mode: toggle   # 'toggle' or 'hold' (hold = close while pressed)
