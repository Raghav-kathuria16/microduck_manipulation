<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microduck Teleop Controller</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦆 Microduck Teleop</h1>
            <div id="status" class="status disconnected">Disconnected</div>
        </header>

        <main class="controls-area">
            <!-- Left: Navigation Map -->
            <div class="map-container">
                <div class="joystick-label">Click to Navigate</div>
                <canvas id="nav_map" width="360" height="300"></canvas>
                <div class="nav-status">
                    <span id="nav_status_text">Idle</span>
                    <button id="btn_stop" class="btn btn-stop">⏹ STOP</button>
                </div>
            </div>

            <!-- Middle Actions -->
            <div class="action-buttons">
                <button id="btn_grasp" class="btn">Grasp Toggle</button>
                <button id="btn_pick" class="btn">Ground Pick</button>
                <button id="btn_sit" class="btn">Sit/Stand</button>
                <button id="btn_reset_head" class="btn">Reset Head</button>
                <button id="btn_randomize" class="btn btn-secondary">Randomize Scene</button>
            </div>

            <!-- Right Joystick: Head Aim -->
            <div class="joystick-container">
                <div class="joystick-label">Head Aim (Look)</div>
                <div class="joystick-zone" id="zone_joystick_right"></div>
            </div>
        </main>
        
        <footer>
            <div class="telemetry">
                <span>Pos: (<span id="val_rx">0.00</span>, <span id="val_ry">0.00</span>)</span>
                <span>Yaw: <span id="val_yaw">0.0</span>°</span>
                <span>V_x: <span id="val_vx">0.00</span></span>
                <span>W_z: <span id="val_wz">0.00</span></span>
                <span>Head: <span id="val_head">0.00, 0.00</span></span>
            </div>
        </footer>
    </div>

    <!-- Nipple.js for virtual joystick (head aim only) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
