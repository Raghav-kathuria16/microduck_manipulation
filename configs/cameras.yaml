# ============================================================
# Camera Preset Definitions
# ============================================================
# Three cameras as specified in Teleop Spec §2.4:
#   1. Top-down orthographic — spatial awareness / minimap
#   2. Chase camera — third-person follow for carry phase
#   3. Beak-cam first-person — grasp precision + training data
#
# GUI layout recommendation:
#   Default: top-down + beak-cam side-by-side
#   Chase-cam togglable as third option
# ============================================================

cameras:
  - name: top_down
    type: orthographic
    description: >
      Bird's-eye view of the whole apartment. Primary spatial-
      awareness view for driving locomotion — like a minimap.
    position: [2.25, 1.50, 5.00]  # centered above the scene
    look_at: [2.25, 1.50, 0.00]   # looking straight down
    up_vector: [0.0, 1.0, 0.0]
    extent: 5.5                    # orthographic extent (meters visible)
    resolution: [640, 480]
    role: navigation
    log_for_training: false        # real robot won't have a god's-eye view

  - name: chase
    type: perspective
    description: >
      Third-person, follows behind/above the robot. Used for
      judging grasp alignment and carry stability.
    follow_body: duck_torso       # MuJoCo body to track
    distance: 0.8                 # meters behind
    elevation: -25.0              # degrees above horizontal
    azimuth: 180.0                # behind the robot
    fov: 60.0
    resolution: [640, 480]
    role: observation
    log_for_training: false

  - name: beak_cam
    type: perspective
    description: >
      Mounted at the beak/head. Used for grasp-phase precision.
      This is the camera feed logged as "vision" input for
      vision-conditioned policy training (SmolVLA, pi0-style),
      since the real robot will only have onboard cameras.
    mount_body: duck_head         # MuJoCo body to attach to
    mount_offset: [0.02, 0.0, 0.01]  # slight forward/up from head center
    fov: 90.0
    resolution: [640, 480]
    role: grasp_precision
    log_for_training: true        # THIS is the training camera

# --- GUI layout ---
gui:
  default_layout: side_by_side
  primary_view: top_down
  secondary_view: beak_cam
  tertiary_view: chase          # togglable, not shown by default
  toggle_key: TAB               # cycle through layouts
