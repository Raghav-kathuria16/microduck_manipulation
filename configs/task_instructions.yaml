# ============================================================
# Task Instruction Strings
# ============================================================
# Natural-language labels attached to every episode, as required
# for language-conditioned VLA fine-tuning (SmolVLA, pi0-style).
#
# Adding these now is free; retrofitting them later is expensive.
# Each episode gets one of these strings (chosen by variant or
# randomly) as its task annotation.
# ============================================================

# --- Primary task descriptions ---
# These describe the full pick-and-place task.
primary:
  - "Pick up the sock and put it in the laundry basket."
  - "Find the sock on the floor, grab it with your beak, carry it to the basket, and drop it in."
  - "Walk to the sock, pick it up, and bring it to the basket in the other room."
  - "Grab the sock and place it in the laundry basket."
  - "Go get the sock and put it away in the basket."

# --- Phase-specific descriptions (for sub-task training) ---
# If you later want to train phase-specific policies or use
# phase labels for curriculum learning.
phases:
  approach:
    - "Walk toward the sock on the floor."
    - "Navigate to the sock."
  grasp:
    - "Pick up the sock with your beak."
    - "Grab the sock."
  carry:
    - "Carry the sock to the laundry basket."
    - "Walk to the basket while holding the sock."
  release:
    - "Drop the sock into the laundry basket."
    - "Release the sock in the basket."
  return:
    - "Return to a stable standing position."
    - "Stand upright after placing the sock."
