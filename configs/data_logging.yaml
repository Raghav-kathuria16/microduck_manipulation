# ============================================================
# Data Logging Configuration
# ============================================================
# Defines what gets logged per timestep and per episode,
# matching the schema in Teleop Spec §3.3.
# ============================================================

logging:
  # --- Per-timestep fields ---
  timestep:
    proprioceptive:
      - joint_positions       # all ~15 DOF
      - joint_velocities      # all ~15 DOF
      - imu_orientation       # quaternion
      - imu_angular_velocity  # 3D
      - imu_linear_acceleration  # 3D

    cameras:
      - name: beak_cam
        log: true
        format: mp4
        fps: 30
        resolution: [640, 480]
      - name: top_down
        log: false             # debug only, not for training
        format: mp4
        fps: 15
        resolution: [320, 240]

    actions:
      description: >
        The human's issued high-level command at this timestep.
        This IS the action label for behavior cloning.
      fields:
        - velocity_command     # [forward_vel, turn_vel]
        - look_at_point        # [x, y] relative to robot
        - beak_nudge           # [dx, dy, dz] or null if inactive
        - grasp_state          # 0 = open, 1 = closed

    privileged:
      description: >
        Object state logged for automated success/failure
        detection and optional critic training. Not available
        at deployment time on the real robot.
      fields:
        - sock_position        # [x, y, z]
        - sock_orientation     # quaternion
        - sock_in_beak         # boolean
        - sock_in_target_zone  # boolean

  # --- Per-episode metadata ---
  episode:
    - episode_id               # unique identifier
    - task_instruction         # natural-language string from task_instructions.yaml
    - scene_variant            # which scene config was active
    - sock_spawn_zone          # which zone the sock started in
    - robot_spawn_pose         # which spawn pose was used
    - lighting_preset          # which lighting was active
    - target_position          # which basket position was used
    - outcome                  # success | failure_fall | failure_drop | failure_timeout | aborted
    - duration_seconds         # wall-clock episode length
    - source                   # teleop | synthetic_resim | synthetic_scripted | synthetic_mirrored | ...
    - timestamp                # ISO 8601

  # --- Output format ---
  output:
    format: lerobot_dataset
    description: >
      LeRobotDataset format: parquet for state/action tabular data,
      MP4 chunks for video, meta/tasks.jsonl for instruction strings,
      delta_timestamps for action chunking.
    raw_output_dir: data/raw
    processed_output_dir: data/processed
