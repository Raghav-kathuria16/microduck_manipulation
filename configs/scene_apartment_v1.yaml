# ============================================================
# Scene Configuration — Apartment v1
# ============================================================
# This file parametrizes the apartment scene WITHOUT defining
# geometry. Scene geometry lives in scenes/apartment_v1/.
# This config controls randomizable aspects: spawn zones,
# target positions, lighting, camera presets.
# ============================================================

scene:
  name: apartment_v1
  description: >
    Single-room-plus-alcove apartment segment, duck-scale.
    Main room ~3.5m x 3.0m, alcove ~1.5m x 1.5m connected
    via open doorway.

# --- Robot spawn poses ---
# Position (x, y) in meters, heading in radians (0 = +x).
# Multiple options for randomization across episodes.
robot_spawn_poses:
  - name: center_facing_alcove
    position: [1.75, 1.50]
    heading: 0.0
  - name: near_wall_facing_sock_a
    position: [0.80, 2.20]
    heading: -0.78  # ~-45°
  - name: far_corner
    position: [2.80, 0.60]
    heading: 0.52   # ~30°

# --- Sock spawn zones ---
# Each zone is a rectangular region; sock spawns at a random
# point within it. Multiple zones for diversity.
sock_spawn_zones:
  - name: zone_a
    description: "Near center of main room"
    bounds:
      x_min: 1.20
      x_max: 2.00
      y_min: 0.80
      y_max: 1.50
  - name: zone_b
    description: "Near alcove doorway"
    bounds:
      x_min: 2.50
      x_max: 3.20
      y_min: 1.20
      y_max: 2.00
  - name: zone_c
    description: "On or near the rug"
    bounds:
      x_min: 0.50
      x_max: 1.50
      y_min: 0.50
      y_max: 1.30

# --- Target (basket) positions ---
# v1: fixed in alcove. Later: randomize among multiple options.
target_positions:
  - name: alcove_default
    position: [4.20, 2.00]
    description: "Laundry basket in alcove, against far wall"
  - name: alcove_near_door
    position: [3.80, 1.20]
    description: "Basket closer to the doorway (future variant)"

# --- Lighting presets ---
# 2–3 presets for visual domain randomization.
lighting_presets:
  - name: daylight
    description: "Bright, warm overhead — simulates daytime"
    ambient: [0.45, 0.42, 0.38]
    diffuse: [0.85, 0.80, 0.75]
    direction: [0.0, 0.0, -1.0]
  - name: evening
    description: "Dimmer, warmer — simulates evening lamp light"
    ambient: [0.25, 0.20, 0.15]
    diffuse: [0.60, 0.45, 0.30]
    direction: [-0.3, 0.0, -1.0]
  - name: overcast
    description: "Flat, cool light — simulates overcast day"
    ambient: [0.35, 0.37, 0.40]
    diffuse: [0.55, 0.55, 0.60]
    direction: [0.0, 0.0, -1.0]
